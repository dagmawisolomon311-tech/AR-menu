<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Bistro Reality AR & Admin</title>

    <!-- A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

        /* AR Overlays */
        #loading { position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: #fff; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; z-index: 999; }
        #close { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 14px 28px; border: none; background: #ff4757; color: white; font-size: 16px; font-weight: 700; border-radius: 12px; z-index: 1000; cursor: pointer; box-shadow: 0 4px 15px rgba(255,71,87,0.4); display: none; }
        
        /* Admin Button on AR Screen */
        #adminToggleBtn { position: fixed; top: 20px; right: 20px; padding: 10px 18px; border: none; background: rgba(255,255,255,0.9); color: #2f3542; font-weight: 700; border-radius: 8px; z-index: 1000; cursor: pointer; }

        /* Admin Modal UI */
        #adminModal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.75); z-index: 2000; display: none; justify-content: center; align-items: center; padding: 20px; }
        .admin-card { background: #fff; border-radius: 16px; padding: 25px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .admin-card h2 { margin-bottom: 15px; color: #2f3542; font-size: 22px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; color: #57606f; margin-bottom: 6px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
        .form-group img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; margin-top: 8px; display: none; border: 1px solid #eee; }
        .btn-submit { width: 100%; padding: 14px; background: #2ed573; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .btn-close-admin { width: 100%; padding: 10px; background: #f1f2f6; color: #57606f; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    </style>

    <script>
        AFRAME.registerComponent('touch-gestures', {
            init: function () {
                this.isDragging = false;
                this.previousPosition = { x: 0, y: 0 };
                this.initialPinchDistance = 0;
                this.currentScale = 1;

                this.onTouchStart = this.onTouchStart.bind(this);
                this.onTouchMove = this.onTouchMove.bind(this);
                this.onTouchEnd = this.onTouchEnd.bind(this);

                this.el.sceneEl.addEventListener('loaded', () => {
                    const canvas = this.el.sceneEl.canvas;
                    canvas.addEventListener('touchstart', this.onTouchStart, { passive: false });
                    canvas.addEventListener('touchmove', this.onTouchMove, { passive: false });
                    canvas.addEventListener('touchend', this.onTouchEnd);
                });
            },

            onTouchStart: function(e) {
                if (e.touches.length === 1) {
                    this.isDragging = true;
                    this.previousPosition = { x: e.touches[0].pageX, y: e.touches[0].pageY };
                } else if (e.touches.length === 2) {
                    this.isDragging = false;
                    this.initialPinchDistance = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                    this.currentScale = this.el.object3D.scale.x;
                }
            },

            onTouchMove: function(e) {
                e.preventDefault(); 

                if (this.isDragging && e.touches.length === 1) {
                    const deltaX = e.touches[0].pageX - this.previousPosition.x;
                    const deltaY = e.touches[0].pageY - this.previousPosition.y;

                    this.el.object3D.rotation.y += deltaX * 0.01;
                    this.el.object3D.rotation.x += deltaY * 0.01;

                    this.previousPosition = { x: e.touches[0].pageX, y: e.touches[0].pageY };
                } else if (e.touches.length === 2) {
                    const currentDistance = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                    const pinchRatio = currentDistance / this.initialPinchDistance;
                    let newScale = this.currentScale * pinchRatio;

                    if (newScale < 0.01) newScale = 0.01;
                    if (newScale > 100) newScale = 100;

                    this.el.object3D.scale.set(newScale, newScale, newScale);
                }
            },

            onTouchEnd: function() {
                this.isDragging = false;
            }
        });
    </script>
</head>
<body>

    <div id="loading">Point camera at target...</div>
    <button id="close">Close AR</button>
    <button id="adminToggleBtn" onclick="openAdminModal()">⚙️ Admin</button>

    <!-- Admin Panel Modal -->
    <div id="adminModal">
        <div class="admin-card">
            <h2>Add Menu Item</h2>
            <form id="addFoodForm">
                <div class="form-group">
                    <label for="foodTitle">Food Name</label>
                    <input type="text" id="foodTitle" placeholder="e.g. Classic Cheeseburger" required>
                </div>
                <div class="form-group">
                    <label for="foodPrice">Price ($)</label>
                    <input type="text" id="foodPrice" placeholder="12.99" required>
                </div>
                <div class="form-group">
                    <label for="foodDesc">Description</label>
                    <textarea id="foodDesc" rows="2" placeholder="Brief description..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="foodImage">Food Image</label>
                    <input type="file" id="foodImage" accept="image/*" required>
                    <img id="imagePreview" alt="Food Preview">
                </div>
                <div class="form-group">
                    <label for="modelNameInput">3D Model File (.glb)</label>
                    <input type="text" id="modelNameInput" placeholder="Avocado.glb" value="Avocado.glb" required>
                </div>
                <button type="submit" class="btn-submit" id="saveBtn">Save to Firebase</button>
                <button type="button" class="btn-close-admin" onclick="closeAdminModal()">Cancel</button>
            </form>
        </div>
    </div>

    <!-- AR Scene -->
    <a-scene 
        mindar-image="imageTargetSrc: targets.mind;" 
        embedded 
        color-space="sRGB" 
        renderer="colorManagement: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets id="assets-container"></a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model 
                id="food-model"
                position="0 0 0" 
                scale="1 1 1" 
                rotation="0 0 0"
                touch-gestures>
            </a-gltf-model>
        </a-entity>
    </a-scene>

    <script>
        // 1. Firebase Initialization (Replace with your Firebase Config keys)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // 2. Load 3D Model into AR Scene
        const urlParams = new URLSearchParams(window.location.search);
        const modelName = urlParams.get('model') || 'Avocado.glb';

        const assetsContainer = document.getElementById('assets-container');
        const foodModelEntity = document.getElementById('food-model');

        const assetItem = document.createElement('a-asset-item');
        assetItem.setAttribute('id', 'dynamic-food-asset');
        assetItem.setAttribute('src', modelName); 
        assetsContainer.appendChild(assetItem);

        foodModelEntity.setAttribute('src', '#dynamic-food-asset');

        // 3. AR Status Handlers
        const loadingEl = document.getElementById("loading");
        const closeBtn = document.getElementById("close");

        const sceneEl = document.querySelector("a-scene");
        sceneEl.addEventListener("ready", () => { loadingEl.style.display = "none"; });
        sceneEl.addEventListener("targetFound", () => { 
            loadingEl.style.display = "none"; 
            closeBtn.style.display = "block";
        });
        sceneEl.addEventListener("targetLost", () => {
            loadingEl.style.display = "flex";
            loadingEl.innerText = "Point camera at target...";
        });

        closeBtn.onclick = () => window.location.href = "index.html";

        // 4. Admin Panel Image Handling & Firestore Operations
        let uploadedImageBase64 = "";

        document.getElementById('foodImage').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedImageBase64 = event.target.result;
                    const preview = document.getElementById('imagePreview');
                    preview.src = uploadedImageBase64;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        function openAdminModal() {
            document.getElementById('adminModal').style.display = 'flex';
        }

        function closeAdminModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        document.getElementById('addFoodForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerText = "Saving...";
            saveBtn.disabled = true;

            const newItem = {
                title: document.getElementById('foodTitle').value,
                price: document.getElementById('foodPrice').value,
                description: document.getElementById('foodDesc').value,
                image: uploadedImageBase64,
                model: document.getElementById('modelNameInput').value,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                await db.collection('menu_items').add(newItem);
                alert("Food item added to Firebase successfully!");
                this.reset();
                document.getElementById('imagePreview').style.display = 'none';
                uploadedImageBase64 = "";
                closeAdminModal();
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("Error saving item: " + error.message);
            } finally {
                saveBtn.innerText = "Save to Firebase";
                saveBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
