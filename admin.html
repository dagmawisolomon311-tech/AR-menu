<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    
    <!-- Firebase SDKs (Firestore Only) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            background-color: #0d0c0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .section-title {
            font-size: 22px;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 15px;
        }

        .card {
            background-color: #171513;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        /* Form Styles */
        input, select {
            width: 100%;
            background-color: #0d0c0b;
            color: white;
            border: 1px solid #2a2622;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .save-btn {
            width: 100%;
            background-color: #f25c05;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        /* List Item Styles */
        .list-item {
            background-color: #1a1714;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-details h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
            color: #f25c05;
        }

        .item-details p {
            margin: 0;
            font-size: 13px;
            color: #999;
        }

        /* Action Buttons */
        .btn-group button {
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-weight: bold;
            margin-left: 5px;
            cursor: pointer;
        }
        .btn-edit { background-color: #ffb300; color: black; }
        .btn-hide { background-color: #4b5563; color: white; }
        .btn-delete { background-color: #e53935; color: white; }
        .btn-approve { background-color: #43a047; color: white; }
    </style>
</head>
<body>

    <!-- ADD NEW DISH SECTION -->
    <h2 class="section-title">Add New Dish</h2>
    <div class="card">
        <form id="addDishForm">
            <select id="dishCategory" required>
                <option value="Food">Food</option>
                <option value="Drink">Drink</option>
            </select>

            <input type="text" id="engName" placeholder="English Name (e.g. Tere Siga)" required>
            <input type="text" id="amhName" placeholder="Amharic Name (e.g. ጥሬ ሥጋ)" required>
            <input type="text" id="engDesc" placeholder="English Description" required>
            <input type="text" id="amhDesc" placeholder="Amharic Description (ማብራሪያ)" required>
            <input type="text" id="price" placeholder="Price (e.g. 480 ETB)" required>
            
            <label style="font-size: 12px; color: #999; margin-bottom: 5px; display: block;">Select Image from Gallery:</label>
            <input type="file" id="imageFile" accept="image/*" required>
            
            <input type="text" id="modelUrl" placeholder="3D Model File URL (e.g. kurt.glb)">

            <button type="submit" class="save-btn" id="saveBtn">Save Dish</button>
        </form>
    </div>

    <!-- CURRENT MENU ITEMS SECTION -->
    <h2 class="section-title">Current Menu Items</h2>
    <div id="menuItemsContainer">
        <!-- Example matching your screenshot -->
        <div class="list-item">
            <div class="item-details">
                <h3>Avoca / አቮካዶ</h3>
                <p>13.5 | Food</p>
            </div>
            <div class="btn-group">
                <button class="btn-edit">Edit</button>
                <button class="btn-hide">Hide</button>
                <button class="btn-delete">Delete</button>
            </div>
        </div>
    </div>

    <!-- PENDING COMMENTS SECTION -->
    <h2 class="section-title">Pending Comments Review</h2>
    <div id="pendingCommentsContainer">
        <!-- Example matching your screenshot -->
        <div class="list-item">
            <div class="item-details">
                <h3>Halid</h3>
                <p>"Tsede"</p>
            </div>
            <div class="btn-group">
                <button class="btn-approve">Approve</button>
                <button class="btn-delete">Reject</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        // Replace with your Firebase settings
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Replace with the key from api.imgbb.com
        const IMGBB_API_KEY = "YOUR_IMGBB_API_KEY_HERE"; 
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // --- 2. ADD DISH LOGIC WITH IMGBB UPLOAD ---
        document.getElementById('addDishForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerText = "Uploading Image...";
            saveBtn.disabled = true;

            try {
                const imageFile = document.getElementById('imageFile').files[0];
                let finalImageUrl = "";

                if (imageFile) {
                    const formData = new FormData();
                    formData.append("image", imageFile);

                    // Send the file to ImgBB
                    const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                        method: "POST",
                        body: formData
                    });

                    const result = await response.json();

                    if (result.success) {
                        finalImageUrl = result.data.url; // Get the generated link
                    } else {
                        throw new Error(result.error ? result.error.message : "Image upload failed");
                    }
                }

                saveBtn.innerText = "Saving Data...";

                // Save all form fields + ImgBB URL to Firestore
                const newDish = {
                    category: document.getElementById('dishCategory').value,
                    englishName: document.getElementById('engName').value,
                    amharicName: document.getElementById('amhName').value,
                    englishDesc: document.getElementById('engDesc').value,
                    amharicDesc: document.getElementById('amhDesc').value,
                    price: document.getElementById('price').value,
                    imageUrl: finalImageUrl, 
                    modelUrl: document.getElementById('modelUrl').value,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                await db.collection('menu_items').add(newDish);
                
                alert("Dish successfully saved!");
                document.getElementById('addDishForm').reset();

            } catch (error) {
                console.error("Error saving dish: ", error);
                alert("Error: " + error.message);
            } finally {
                saveBtn.innerText = "Save Dish";
                saveBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
