<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Login</title>
    
    <!-- Firebase SDKs (Auth and Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            background-color: #0d0c0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .section-title {
            font-size: 22px;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 15px;
        }

        .card {
            background-color: #171513;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        /* Form Styles */
        input, select {
            width: 100%;
            background-color: #0d0c0b;
            color: white;
            border: 1px solid #2a2622;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-primary { background-color: #f25c05; }
        .btn-secondary { background-color: #333; margin-top: 10px; width: auto; padding: 10px 20px;}

        /* List Item Styles */
        .list-item {
            background-color: #1a1714;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-details h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
            color: #f25c05;
        }

        .item-details p {
            margin: 0;
            font-size: 13px;
            color: #999;
        }

        /* Action Buttons */
        .btn-group button {
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-weight: bold;
            margin-left: 5px;
            cursor: pointer;
        }
        .btn-edit { background-color: #ffb300; color: black; }
        .btn-hide { background-color: #4b5563; color: white; }
        .btn-delete { background-color: #e53935; color: white; }
        .btn-approve { background-color: #43a047; color: white; }

        /* Login Container Formatting */
        #loginContainer {
            max-width: 400px;
            margin: 100px auto;
            text-align: center;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- LOGIN SECTION -->
    <div id="loginContainer">
        <h2 style="color: #f25c05; font-size: 28px;">Admin Access</h2>
        <p style="color: #999; margin-bottom: 20px;">Please log in to manage the menu.</p>
        <div class="card">
            <form id="loginForm">
                <input type="email" id="adminEmail" placeholder="Admin Email" required>
                <input type="password" id="adminPassword" placeholder="Password" required>
                <button type="submit" class="btn btn-primary" id="loginBtn">Login</button>
                <p id="loginError" style="color: #e53935; font-size: 14px; margin-top: 15px; display: none;"></p>
            </form>
        </div>
    </div>

    <!-- MAIN DASHBOARD SECTION (Hidden by default) -->
    <div id="dashboardContainer" style="display: none;">
        <div class="header-flex">
            <h2 class="section-title">Dukem Admin Dashboard</h2>
            <button id="logoutBtn" class="btn btn-secondary">Logout</button>
        </div>

        <!-- ADD NEW DISH SECTION -->
        <h2 class="section-title">Add New Dish</h2>
        <div class="card">
            <form id="addDishForm">
                <select id="dishCategory" required>
                    <option value="Food">Food</option>
                    <option value="Drink">Drink</option>
                </select>

                <input type="text" id="engName" placeholder="English Name (e.g. Tere Siga)" required>
                <input type="text" id="amhName" placeholder="Amharic Name (e.g. ጥሬ ሥጋ)" required>
                <input type="text" id="engDesc" placeholder="English Description" required>
                <input type="text" id="amhDesc" placeholder="Amharic Description (ማብራሪያ)" required>
                <input type="text" id="price" placeholder="Price (e.g. 480 ETB)" required>
                
                <label style="font-size: 12px; color: #999; margin-bottom: 5px; display: block;">Select Image from Gallery:</label>
                <input type="file" id="imageFile" accept="image/*">
                
                <input type="text" id="modelUrl" placeholder="3D Model File URL (e.g. kurt.glb)">

                <button type="submit" class="btn btn-primary" id="saveBtn">Save Dish</button>
            </form>
        </div>

        <!-- CURRENT MENU ITEMS SECTION -->
        <h2 class="section-title">Current Menu Items</h2>
        <div id="menuItemsContainer"></div>

        <!-- PENDING COMMENTS SECTION -->
        <h2 class="section-title">Pending Comments Review</h2>
        <div id="pendingCommentsContainer"></div>

        <!-- LIVE / APPROVED COMMENTS SECTION -->
        <h2 class="section-title">Live / Approved Comments</h2>
        <div id="approvedCommentsContainer"></div>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const firebaseConfig = {
          apiKey: "AIzaSyC11AWjH6Ftv17VNmD4Q7zXeekgQ6-OaGc",
          authDomain: "bistro-reality.firebaseapp.com",
          projectId: "bistro-reality",
          storageBucket: "bistro-reality.firebasestorage.app",
          messagingSenderId: "3168029834",
          appId: "1:3168029834:web:ce82c2ad96dab6bc0d7173"
        };

        const IMGBB_API_KEY = "cca6600adeef7dd4882e0d0e20faa642"; 
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const auth = firebase.auth();
        const db = firebase.firestore();

        let editingItemId = null;
        let menuUnsubscribe = null;
        let commentsUnsubscribe = null;

        // --- 2. AUTHENTICATION LOGIC ---
        const loginContainer = document.getElementById('loginContainer');
        const dashboardContainer = document.getElementById('dashboardContainer');
        const loginError = document.getElementById('loginError');

        // Monitor Login State
        auth.onAuthStateChanged(user => {
            if (user) {
                // User is signed in
                loginContainer.style.display = 'none';
                dashboardContainer.style.display = 'block';
                loadMenuItems();
                loadComments();
            } else {
                // User is signed out
                loginContainer.style.display = 'block';
                dashboardContainer.style.display = 'none';
                
                // Stop listening to database if logged out to save reads
                if(menuUnsubscribe) menuUnsubscribe();
                if(commentsUnsubscribe) commentsUnsubscribe();
            }
        });

        // Handle Login Submission
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const btn = document.getElementById('loginBtn');
            
            btn.innerText = "Authenticating...";
            loginError.style.display = 'none';

            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    btn.innerText = "Login";
                    document.getElementById('loginForm').reset();
                })
                .catch((error) => {
                    btn.innerText = "Login";
                    loginError.innerText = error.message;
                    loginError.style.display = 'block';
                });
        });

        // Handle Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            auth.signOut();
        });


        // --- 3. ADD / EDIT DISH LOGIC WITH IMGBB UPLOAD ---
        document.getElementById('addDishForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerText = "Processing...";
            saveBtn.disabled = true;

            try {
                const imageFile = document.getElementById('imageFile').files[0];
                let finalImageUrl = "";

                if (imageFile) {
                    if (IMGBB_API_KEY === "YOUR_IMGBB_API_KEY_HERE") {
                        throw new Error("Please insert your ImgBB API Key in admin.html line 161.");
                    }
                    saveBtn.innerText = "Uploading Image...";
                    const formData = new FormData();
                    formData.append("image", imageFile);

                    const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                        method: "POST",
                        body: formData
                    });

                    const result = await response.json();

                    if (result.success) {
                        finalImageUrl = result.data.url;
                    } else {
                        throw new Error(result.error ? result.error.message : "Image upload failed");
                    }
                }

                saveBtn.innerText = "Saving Data...";

                const dishData = {
                    category: document.getElementById('dishCategory').value,
                    englishName: document.getElementById('engName').value,
                    amharicName: document.getElementById('amhName').value,
                    englishDesc: document.getElementById('engDesc').value,
                    amharicDesc: document.getElementById('amhDesc').value,
                    price: document.getElementById('price').value,
                    modelUrl: document.getElementById('modelUrl').value
                };

                if (finalImageUrl) {
                    dishData.imageUrl = finalImageUrl;
                }

                if (editingItemId) {
                    await db.collection('menu_items').doc(editingItemId).update(dishData);
                    alert("Dish successfully updated!");
                    editingItemId = null;
                } else {
                    dishData.hidden = false;
                    dishData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection('menu_items').add(dishData);
                    alert("Dish successfully saved!");
                }

                document.getElementById('addDishForm').reset();
                saveBtn.innerText = "Save Dish";

            } catch (error) {
                console.error("Error saving dish: ", error);
                alert("Error: " + error.message);
            } finally {
                saveBtn.innerText = "Save Dish";
                saveBtn.disabled = false;
            }
        });


        // --- 4. FETCH AND DISPLAY MENU ITEMS ---
        function loadMenuItems() {
            menuUnsubscribe = db.collection('menu_items').onSnapshot(snapshot => {
                const container = document.getElementById('menuItemsContainer');
                container.innerHTML = '';

                if (snapshot.empty) {
                    container.innerHTML = '<p style="color:#888;">No menu items found.</p>';
                    return;
                }

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const id = doc.id;

                    const engName = data.englishName || data.Name || 'Unnamed';
                    const amhName = data.amharicName || data.NameAm || '';
                    const itemPrice = data.price || data.Price || '0';
                    const itemCategory = data.category || data.Category || 'Food';

                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'list-item';
                    itemDiv.innerHTML = `
                        <div class="item-details">
                            <h3>${engName} ${amhName ? '/ ' + amhName : ''}</h3>
                            <p>${itemPrice} | ${itemCategory} ${data.hidden ? '(Hidden)' : ''}</p>
                        </div>
                        <div class="btn-group">
                            <button class="btn-edit" onclick="editItem('${id}')">Edit</button>
                            <button class="btn-hide" onclick="toggleHideItem('${id}', ${data.hidden || false})">${data.hidden ? 'Show' : 'Hide'}</button>
                            <button class="btn-delete" onclick="deleteItem('${id}')">Delete</button>
                        </div>
                    `;
                    container.appendChild(itemDiv);
                });
            });
        }


        // --- MENU ITEM ACTIONS ---
        async function editItem(id) {
            const doc = await db.collection('menu_items').doc(id).get();
            if (doc.exists) {
                const data = doc.data();
                document.getElementById('dishCategory').value = data.category || data.Category || 'Food';
                document.getElementById('engName').value = data.englishName || data.Name || '';
                document.getElementById('amhName').value = data.amharicName || data.NameAm || '';
                document.getElementById('engDesc').value = data.englishDesc || data.Description || '';
                document.getElementById('amhDesc').value = data.amharicDesc || data.DescriptionAm || '';
                document.getElementById('price').value = data.price || data.Price || '';
                document.getElementById('modelUrl').value = data.modelUrl || data.Model || '';
                
                editingItemId = id;
                document.getElementById('saveBtn').innerText = "Update Dish";
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        async function toggleHideItem(id, currentStatus) {
            await db.collection('menu_items').doc(id).update({ hidden: !currentStatus });
        }

        async function deleteItem(id) {
            if (confirm("Are you sure you want to delete this dish?")) {
                await db.collection('menu_items').doc(id).delete();
            }
        }

        // --- 5. FETCH AND DISPLAY COMMENTS ---
        function loadComments() {
            commentsUnsubscribe = db.collection('comments').onSnapshot(snapshot => {
                const pendingContainer = document.getElementById('pendingCommentsContainer');
                const approvedContainer = document.getElementById('approvedCommentsContainer');
                
                pendingContainer.innerHTML = '';
                approvedContainer.innerHTML = '';

                let pendingCount = 0;
                let approvedCount = 0;

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const id = doc.id;

                    const commentDiv = document.createElement('div');
                    commentDiv.className = 'list-item';

                    if (data.status === 'pending') {
                        pendingCount++;
                        commentDiv.innerHTML = `
                            <div class="item-details">
                                <h3>${data.author || data.name || 'Anonymous'}</h3>
                                <p>"${data.text || ''}"</p>
                            </div>
                            <div class="btn-group">
                                <button class="btn-approve" onclick="updateCommentStatus('${id}', 'approved')">Approve</button>
                                <button class="btn-delete" onclick="deleteComment('${id}')">Reject</button>
                            </div>
                        `;
                        pendingContainer.appendChild(commentDiv);
                    } else if (data.status === 'approved') {
                        approvedCount++;
                        commentDiv.innerHTML = `
                            <div class="item-details">
                                <h3>${data.author || data.name || 'Anonymous'}</h3>
                                <p>"${data.text || ''}"</p>
                            </div>
                            <div class="btn-group">
                                <button class="btn-hide" onclick="updateCommentStatus('${id}', 'pending')">Hide</button>
                                <button class="btn-delete" onclick="deleteComment('${id}')">Delete</button>
                            </div>
                        `;
                        approvedContainer.appendChild(commentDiv);
                    }
                });

                if (pendingCount === 0) pendingContainer.innerHTML = '<p style="color:#888;">No pending comments.</p>';
                if (approvedCount === 0) approvedContainer.innerHTML = '<p style="color:#888;">No approved comments.</p>';
            });
        }

        // --- COMMENT ACTIONS ---
        async function updateCommentStatus(id, status) {
            await db.collection('comments').doc(id).update({ status: status });
        }

        async function deleteComment(id) {
            if (confirm("Are you sure you want to delete this comment?")) {
                await db.collection('comments').doc(id).delete();
            }
        }
    </script>
</body>
</html>
