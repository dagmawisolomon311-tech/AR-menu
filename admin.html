<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Bistro Reality AR & Admin</title>

    <!-- A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- Firebase SDKs (App & Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        html, body { margin: 0; overflow: hidden; width: 100%; height: 100%; touch-action: none; font-family: -apple-system, sans-serif; }
        
        /* AR UI */
        #loading { position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: black; color: white; display: flex; justify-content: center; align-items: center; font-size: 22px; z-index: 999; }
        #close { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); padding: 15px 30px; border: none; background: #ff5722; color: white; font-size: 18px; border-radius: 10px; z-index: 1000; cursor: pointer; }
        #adminBtn { position: fixed; top: 20px; right: 20px; padding: 10px 15px; border: none; background: white; color: black; font-weight: bold; border-radius: 8px; z-index: 1000; cursor: pointer; }

        /* Admin Modal */
        #adminModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; display: none; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .admin-content { background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; box-sizing: border-box; }
        .admin-content h2 { margin-top: 0; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-cancel { width: 100%; padding: 10px; background: #f44336; color: white; border: none; border-radius: 5px; font-size: 14px; cursor: pointer; margin-top: 10px; }
    </style>

    <script>
        AFRAME.registerComponent('touch-gestures', {
            init: function () {
                this.isDragging = false;
                this.previousPosition = { x: 0, y: 0 };
                this.initialPinchDistance = 0;
                this.currentScale = 1;

                this.onTouchStart = this.onTouchStart.bind(this);
                this.onTouchMove = this.onTouchMove.bind(this);
                this.onTouchEnd = this.onTouchEnd.bind(this);

                this.el.sceneEl.addEventListener('loaded', () => {
                    const canvas = this.el.sceneEl.canvas;
                    canvas.addEventListener('touchstart', this.onTouchStart, { passive: false });
                    canvas.addEventListener('touchmove', this.onTouchMove, { passive: false });
                    canvas.addEventListener('touchend', this.onTouchEnd);
                });
            },

            onTouchStart: function(e) {
                if (e.touches.length === 1) {
                    this.isDragging = true;
                    this.previousPosition = { x: e.touches[0].pageX, y: e.touches[0].pageY };
                } else if (e.touches.length === 2) {
                    this.isDragging = false;
                    this.initialPinchDistance = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                    this.currentScale = this.el.object3D.scale.x;
                }
            },

            onTouchMove: function(e) {
                e.preventDefault(); 

                if (this.isDragging && e.touches.length === 1) {
                    const deltaX = e.touches[0].pageX - this.previousPosition.x;
                    const deltaY = e.touches[0].pageY - this.previousPosition.y;

                    this.el.object3D.rotation.y += deltaX * 0.01;
                    this.el.object3D.rotation.x += deltaY * 0.01;

                    this.previousPosition = { x: e.touches[0].pageX, y: e.touches[0].pageY };
                } else if (e.touches.length === 2) {
                    const currentDistance = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                    const pinchRatio = currentDistance / this.initialPinchDistance;
                    let newScale = this.currentScale * pinchRatio;

                    if (newScale < 0.01) newScale = 0.01;
                    if (newScale > 100) newScale = 100;

                    this.el.object3D.scale.set(newScale, newScale, newScale);
                }
            },

            onTouchEnd: function() {
                this.isDragging = false;
            }
        });
    </script>
</head>
<body>

    <!-- AR UI Overlays -->
    <div id="loading">Loading AR...</div>
    <button id="close">Close</button>
    <button id="adminBtn" onclick="openAdmin()">Admin</button>

    <!-- Admin Panel Modal -->
    <div id="adminModal">
        <div class="admin-content">
            <h2>Add Menu Item</h2>
            <form id="addFoodForm">
                <div class="form-group">
                    <label>Food Name:</label>
                    <input type="text" id="foodTitle" required>
                </div>
                <div class="form-group">
                    <label>Price:</label>
                    <input type="text" id="foodPrice" required>
                </div>
                <div class="form-group">
                    <label>Description:</label>
                    <textarea id="foodDesc" rows="2" required></textarea>
                </div>
                <div class="form-group">
                    <label>Select Image from Gallery:</label>
                    <input type="file" id="foodImage" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label>3D Model File Name (.glb):</label>
                    <input type="text" id="modelNameInput" value="Avocado.glb" required>
                </div>
                <button type="submit" class="btn-submit" id="saveBtn">Upload & Save</button>
                <button type="button" class="btn-cancel" onclick="closeAdmin()">Cancel</button>
            </form>
        </div>
    </div>

    <!-- AR Scene -->
    <a-scene 
        mindar-image="imageTargetSrc: targets.mind;" 
        embedded 
        color-space="sRGB" 
        renderer="colorManagement: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets id="assets-container"></a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model 
                id="food-model"
                position="0 0 0" 
                scale="1 1 1" 
                rotation="0 0 0"
                touch-gestures>
            </a-gltf-model>
        </a-entity>
    </a-scene>

    <script>
        // --- 1. CONFIGURATION ---
        // REPLACE THESE WITH YOUR ACTUAL FIREBASE CONFIG KEYS
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // PASTE YOUR IMGBB API KEY HERE (from api.imgbb.com)
        const IMGBB_API_KEY = "YOUR_IMGBB_API_KEY";
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // --- 2. AR MODEL LOADING & UI ---
        const urlParams = new URLSearchParams(window.location.search);
        const modelName = urlParams.get('model') || 'Avocado.glb';

        const assetsContainer = document.getElementById('assets-container');
        const foodModelEntity = document.getElementById('food-model');

        const assetItem = document.createElement('a-asset-item');
        assetItem.setAttribute('id', 'dynamic-food-asset');
        assetItem.setAttribute('src', modelName); 
        assetsContainer.appendChild(assetItem);

        foodModelEntity.setAttribute('src', '#dynamic-food-asset');

        const sceneEl = document.querySelector("a-scene");
        sceneEl.addEventListener("ready", () => document.getElementById("loading").style.display = "none");
        sceneEl.addEventListener("targetFound", () => document.getElementById("loading").style.display = "none");
        sceneEl.addEventListener("arReady", () => document.getElementById("loading").style.display = "none");

        document.getElementById("close").onclick = () => window.location.href = "index.html";

        // --- 3. ADMIN PANEL LOGIC & IMGBB UPLOAD ---
        function openAdmin() {
            document.getElementById('adminModal').style.display = 'flex';
        }

        function closeAdmin() {
            document.getElementById('adminModal').style.display = 'none';
            document.getElementById('addFoodForm').reset();
        }

        document.getElementById('addFoodForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerText = "Uploading Image...";
            saveBtn.disabled = true;

            try {
                const imageFile = document.getElementById('foodImage').files[0];
                let finalImageUrl = "";

                if (imageFile) {
                    // Upload image directly to ImgBB API
                    const formData = new FormData();
                    formData.append("image", imageFile);

                    const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                        method: "POST",
                        body: formData
                    });

                    const result = await response.json();

                    if (result.success) {
                        finalImageUrl = result.data.url; // Retrieve public image URL from ImgBB
                    } else {
                        throw new Error(result.error ? result.error.message : "Image upload failed");
                    }
                }

                saveBtn.innerText = "Saving Data...";

                // Save item details and ImgBB image URL into Firestore
                const newItem = {
                    title: document.getElementById('foodTitle').value,
                    price: document.getElementById('foodPrice').value,
                    description: document.getElementById('foodDesc').value,
                    image: finalImageUrl, 
                    model: document.getElementById('modelNameInput').value,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                await db.collection('menu_items').add(newItem);
                
                alert("Menu item and image successfully saved!");
                closeAdmin();

            } catch (error) {
                console.error("Error saving item: ", error);
                alert("Error: " + error.message);
            } finally {
                saveBtn.innerText = "Upload & Save";
                saveBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
